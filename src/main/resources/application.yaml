
spring:
  application:
    name: auth-service

  profiles:
    default: local

  main:
    banner-mode: console

application:
  version: "@project.version@"

  api:
    auth:
      main-url: /api/v1/auth

kajasa:
  security:
    password:
      argon2:
        algorithm: argon2id
        memory: 19456
        iterations: 2
        parallelism: 1
        salt-length: 16
        hash-length: 32

    email-code:
      length: 6
      expiration-minutes: 10
      max-attempts: 3